<!DOCTYPE html>
<html lang="es" style="overflow-x: hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO -->
    <title>CIPSA OrderX | Procesamiento Inteligente de Pedidos ERP</title>
    <meta name="description" content="Herramienta de apoyo ERP/CRM para generar pedidos, cotizaciones y distribución de forma inteligente." />
    <meta name="author" content="Carlos Cusi" />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="ERP, CRM, pedidos, cotización, distribución, CIPSA, VES" />
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="CIPSA OrderX | Procesamiento Inteligente de Pedidos ERP" />
    <meta property="og:description" content="Genera pedidos y distribuciones desde datos del ERP VES de forma inteligente." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CIPSA OrderX" />
    <meta name="twitter:description" content="Procesamiento inteligente de pedidos ERP" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/Logo_cipsa_solid.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    
    <style>
      html, body { overflow-x: hidden; margin: 0; padding: 0; }
      /* Evita flash de tema incorrecto antes de que SolidJS monte */
      html[data-theme="light"] body { background: #ffffff; color: #1e293b; }
      html[data-theme="dark"] body  { background: #0b1220; color: #f0f4f8; }
    </style>
    <script>
      (function () {
        var key = 'g360_theme_dark';
        var isDark = localStorage.getItem(key) !== 'false';
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      })();
      if (!window.location.hash) {
        window.location.replace(window.location.href + '#/')
      }
    </script>
  </head>
  <body style="overflow-x: hidden;">
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
